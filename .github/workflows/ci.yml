name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - run: dotnet tool restore
      - run: dotnet restore BashCantina.slnx
      - run: dotnet build BashCantina.slnx --configuration Release --no-restore -warnaserror
      - run: dotnet test BashCantina.slnx --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Check migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/Cantina.Infrastructure --startup-project src/Cantina.Api --configuration Release --no-build
      - name: Check vulnerable dependencies
        shell: bash
        run: |
          dotnet list BashCantina.slnx package --vulnerable --include-transitive --format json > /tmp/dependency-audit.json
          cat /tmp/dependency-audit.json
          python3 -c 'import json; d=json.load(open("/tmp/dependency-audit.json")); assert not d.get("errors"), "Dependency audit failed"; assert not any(p.get("vulnerabilities") for project in d.get("projects",[]) for framework in project.get("frameworks",[]) for key in ("topLevelPackages","transitivePackages") for p in framework.get(key,[])), "Vulnerable dependency found"'
      - name: Build container
        run: docker build --tag cantina-api:ci .
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults
